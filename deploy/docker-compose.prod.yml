services:
  mini-novel-mysql:
    image: mysql:8.4
    container_name: mini-novel-mysql
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--mysql-native-password=ON", "--disable-log-bin"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mini_novel}
      TZ: Asia/Shanghai
    volumes:
      - mini-novel-mysql-data:/var/lib/mysql
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  mini-novel-redis:
    image: redis:7.4-alpine
    container_name: mini-novel-redis
    restart: unless-stopped
    volumes:
      - mini-novel-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  mini-novel-app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mini-novel-app
    restart: unless-stopped
    depends_on:
      mini-novel-mysql:
        condition: service_healthy
      mini-novel-redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mini-novel-mysql:3306/${MYSQL_DATABASE:-mini_novel}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: mini-novel-redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "0.0.0.0:${APP_PORT:-8080}:8080"
    volumes:
      - mini-novel-cover-cache:/var/cache/covers

  mini-novel-h5:
    build:
      context: ../mini-novel-h5
      dockerfile: Dockerfile
    container_name: mini-novel-h5
    restart: unless-stopped
    depends_on:
      - mini-novel-app
    ports:
      - "0.0.0.0:${H5_PORT:-5173}:80"

  mini-novel-crawler-service:
    build:
      context: ..
      dockerfile: Dockerfile.crawler-service
    container_name: mini-novel-crawler-service
    restart: unless-stopped
    depends_on:
      mini-novel-mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:mysql://mini-novel-mysql:3306/${MYSQL_DATABASE:-mini_novel}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 自动调度总开关：开启后按 crawl_schedule 配置定时执行（当前仅 id=13 每天 04:00 抓取 23qb 源）
      # 若磁盘告急可临时改为 false 暂停自动抓取
      CRAWLER_SCHEDULE_ENABLED: "true"
    expose:
      - "8090"

  mini-novel-admin-ui:
    build:
      context: ../mini-novel-admin-ui
      dockerfile: Dockerfile
    container_name: mini-novel-admin-ui
    restart: unless-stopped
    depends_on:
      - mini-novel-app
      - mini-novel-crawler-service
    ports:
      - "0.0.0.0:${ADMIN_PORT:-5180}:80"

volumes:
  mini-novel-mysql-data:
  mini-novel-redis-data:
  mini-novel-cover-cache:
