# 统一入口网关（mini-novel-gateway）
# 对外只暴露 80 / 443：
#   https://xs2026.site/            -> H5 阅读端（容器内部再反代 /api/ 与 /cover/）
#   https://xs2026.site/admin/      -> 管理后台静态站
#   https://xs2026.site/admin-api/  -> 后台接口（转发给 admin-ui 容器，再由其转发到 mini-novel-app:8080）
#   https://xs2026.site/crawler-api/-> 爬虫接口（同上）
#   http://  ->  301 跳转到 https://xs2026.site（保留原路径）
# 5173 / 5180 / 8080 在 compose 中只绑定 127.0.0.1，不对外暴露。
#
# 证书放在宿主机 /opt/mini-h5-certs（rsync 同步目录之外，部署不会覆盖），只读挂载到 /etc/nginx/certs：
#   fullchain.pem  站点证书 + 中间证书（缺中间证书会导致部分安卓/微信 WebView 报证书链不完整）
#   privkey.pem    未加密私钥（带 passphrase 的私钥 nginx 起不来）

# Docker 内嵌 DNS：配合变量式 proxy_pass，容器重建后能重新解析上游 IP，
# 避免 nginx 启动时缓存旧 IP 导致部署后 502（2026-09-05 事故的根因）。
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket / SSE 透传所需的 Connection 头映射
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# ---------- HTTP：只做跳转与健康检查 ----------
server {
  listen 80;
  listen [::]:80;
  server_name xs2026.site www.xs2026.site _;

  # 健康检查保持 200（供部署脚本在 http 上探测）
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # 固定跳转到主域名，避免用 IP 访问时跳到 https://<ip> 触发证书告警
  location / {
    return 301 https://xs2026.site$request_uri;
  }
}

# ---------- HTTPS：真实业务入口 ----------
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name xs2026.site www.xs2026.site _;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # 一年内浏览器强制走 HTTPS（不含 includeSubDomains，不影响其它子域）
  add_header Strict-Transport-Security "max-age=31536000" always;

  # 后台图文/视频上传 ≤300MB，必须与 admin-ui 的 client_max_body_size 对齐，
  # 否则网关会在请求到达容器前先返回 413。
  client_max_body_size 320m;

  # 大文件上传/长请求超时
  proxy_connect_timeout 30s;
  proxy_send_timeout    300s;
  proxy_read_timeout    300s;

  set $h5_upstream    http://mini-novel-h5:80;
  set $admin_upstream http://mini-novel-admin-ui:80;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # 后台：无斜杠时补斜杠（admin-ui 的静态资源按 /admin/ 路径部署）
  location = /admin {
    return 301 /admin/;
  }

  location ^~ /admin/ {
    proxy_pass $admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  location ^~ /admin-api/ {
    proxy_pass $admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /crawler-api/ {
    proxy_pass $admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # H5 阅读端（含 /api/、/cover/、静态资源与 SPA 回退）
  location / {
    proxy_pass $h5_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
