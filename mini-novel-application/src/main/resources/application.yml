server:
  port: 8080
  # 大视频/图集上传（多媒体池子）
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 350MB

app:
  public-h5-base-url: ${PUBLIC_H5_BASE_URL:https://xs2026.site}
  # 订阅频道定价（单位：快乐币）
  # 周期：WEEK=1周 / MONTH=1月 / QUARTER=1季 / YEAR=1年
  subscribe:
    prices:
      WEEK: 100      # 1 周订阅价格
      MONTH: 300     # 1 月订阅价格
      QUARTER: 800   # 1 季订阅价格
      YEAR: 3000     # 1 年订阅价格

  # 快乐币充值（人工确认到账方案）
  coin:
    recharge:
      # 收款码图片地址：换成你自己的微信/支付宝收款码截图（可放 H5 静态资源或任意可访问 URL）
      # 微信收款码已内置到 H5 静态资源（mini-novel-h5/public/wx-qr.jpg），部署后通过 /wx-qr.jpg 访问
      wx-qr-url: "/wx-qr.jpg"
      alipay-qr-url: ""
      notice: "转账时请务必在备注中填写订单号，到账后工作人员会尽快确认；未备注可能影响核对。"
      packages:
        - id: 1
          name: "300 快乐币"
          coins: 300
          amount-yuan: "3.00"
        - id: 2
          name: "1000 快乐币"
          coins: 1000
          amount-yuan: "9.90"
        - id: 3
          name: "3000 快乐币"
          coins: 3000
          amount-yuan: "28.00"
        - id: 4
          name: "8000 快乐币"
          coins: 8000
          amount-yuan: "68.00"

spring:
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 320MB
  application:
    name: mini-novel
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:mini_novel}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  token-style: uuid

springdoc:
  swagger-ui:
    path: /swagger-ui.html
