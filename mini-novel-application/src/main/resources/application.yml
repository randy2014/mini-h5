server:
  port: 8080
  # 大视频/图集上传（多媒体池子）
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 350MB

app:
  public-h5-base-url: ${PUBLIC_H5_BASE_URL:https://xs2026.site}
  # 订阅频道定价（单位：快乐币）
  # 周期：WEEK=1周 / MONTH=1月 / QUARTER=1季 / YEAR=1年
  subscribe:
    prices:
      WEEK: 100      # 1 周订阅价格
      MONTH: 300     # 1 月订阅价格
      QUARTER: 800   # 1 季订阅价格
      YEAR: 3000     # 1 年订阅价格

spring:
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 320MB
  application:
    name: mini-novel
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:mini_novel}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  token-style: uuid

springdoc:
  swagger-ui:
    path: /swagger-ui.html
