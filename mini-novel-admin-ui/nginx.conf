server {
  listen 80;
  server_name _;

  # 端口映射场景下，避免 nginx 301/302 绝对 URL 丢失外部端口
  port_in_redirect off;
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  # HTML 不缓存，避免升级后浏览器仍使用旧 index.html
  location ~* \.html$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # 后台部署在 /admin/ 子路径，根路径重定向过去
  location = / {
    return 302 /admin/;
  }

  location / {
    try_files $uri $uri/ /admin/index.html;
  }

  location /admin-api/ {
    proxy_pass http://mini-novel-app:8080/admin/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /crawler-api/ {
    proxy_pass http://mini-novel-crawler-service:8090/crawler/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
